[buildPlans.Mayuri]
family = "Mayuri"
serifs = "sans"
spacing = "normal"

[buildPlans.Mayuri.variants]
inherits = "ss09"

[buildPlans.Mayuri.variants.design]
capital-a = 'straight-serifless'
capital-b = 'more-asymmetric-serifless'
capital-c = 'serifless'
capital-d = 'more-rounded-serifless'
capital-g = 'toothless-corner-serifless-hooked'
capital-k = 'symmetric-connected-serifless'
capital-u = 'toothless-rounded-serifless'
a = 'single-storey-earless-corner-tailed'
b = 'toothless-corner-serifless'
c = 'serifless'
d = 'toothless-corner-serifless'
e = 'flat-crossbar'
f = 'flat-hook-serifless'
g = 'single-storey-earless-corner'
i = 'zshaped'
j = 'serifed'
k = 'straight-serifless'
l = 'zshaped'
m = 'earless-rounded-double-arch-serifless'
n = 'earless-corner-straight-serifless'
p = 'earless-corner-serifless'
q = 'earless-corner-straight-serifless'
r = 'earless-corner-serifless'
t = 'bent-hook'
u = 'toothless-rounded-serifless'
y = 'straight-turn-serifless'
zero = 'reverse-slashed'
one = 'base-long-top-serif'
two = 'curly-neck-serifless'
three = 'flat-top-serifless'
four = 'semi-open-non-crossing-serifless'
five = 'upright-arched-serifless'
six = 'open-contour'
seven = 'bend-serifless'
eight = 'two-circles'
nine = 'open-contour'
asterisk = 'penta-low'
brace = 'curly-flat-boundary'
cent = 'open'
dollar = 'open'
number-sign = 'upright-tall'
paren = 'large-contour'
percent = 'rings-continuous-slash'
underscore = 'high'
punctuation-dot = 'round'
at = 'threefold-tall'
digit-form = 'lining'

[buildPlans.Mayuri.variants.italic]
a = 'single-storey-earless-corner-tailed'
b = 'toothless-rounded-serifless'
d = 'toothless-rounded-serifless'
e = 'rounded'
f = 'flat-hook-tailed'
g = 'single-storey-earless-rounded'
i = 'tailed-serifed'
j = 'serifed'
k = 'cursive-serifless'
l = 'tailed-serifed'
m = 'earless-rounded-double-arch-serifless'
n = 'earless-rounded-straight-serifless'
p = 'earless-rounded-serifless'
q = 'earless-rounded-straight-serifless'
r = 'earless-rounded-serifless'
t = 'bent-hook'
u = 'toothless-rounded-serifless'
y = 'cursive-serifless'

[buildPlans.Mayuri.ligations]
inherits = "default-calt"
disables = []
enables  = [
    "center-ops",
    "arrow-l",
    "arrow-r",
    "arrow-lr",
    "trig",
    "eqeqeq",
    "eqeq",
    "lteq",
    "gteq",
    "exeqeq",
    "exeq",
    "brst",
    "plus-plus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

###################################################################################################
[buildPlans.Mayuri.weights.Regular]
shape = 400
menu = 400
css = 400
[buildPlans.Mayuri.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.Mayuri.weights.Medium]
shape = 500
menu = 500
css = 500
[buildPlans.Mayuri.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.Mayuri.slopes.upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.Mayuri.slopes.italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"
