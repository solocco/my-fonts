name: Build Fonts

on:
  workflow_dispatch:
    inputs:
      iosevka_tag:
        description: "Iosevka tag to build (leave empty for latest)"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * 1"

jobs:
  # ──────────────────────────────────────────────
  # Detect latest Iosevka version
  # ──────────────────────────────────────────────
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      nf_tag: ${{ steps.check.outputs.nf_tag }}
    permissions:
      contents: read
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.iosevka_tag }}" ]; then
            TAG="${{ inputs.iosevka_tag }}"
          else
            TAG=$(gh release list --repo be5invis/Iosevka --limit 50 \
              --json tagName,isPrerelease,isDraft \
              --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' \
              | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Failed to fetch latest Iosevka tag"
            exit 1
          fi
          VERSION="${TAG#v}"

          NF_TAG=$(gh api repos/ryanoasis/nerd-fonts/releases/latest --jq '.tag_name') || {
            echo "::error::Failed to fetch latest Nerd Fonts release"
            exit 1
          }
          if [ -z "$NF_TAG" ]; then
            echo "::error::Got empty Nerd Fonts tag"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "nf_tag=$NF_TAG" >> "$GITHUB_OUTPUT"
          echo "✓ Iosevka: $TAG | Nerd Fonts: $NF_TAG"

  # ──────────────────────────────────────────────
  # Build custom fonts from source
  # ──────────────────────────────────────────────
  build:
    needs: detect-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        font:
          - name: IoskeleyMono
            plan: IoskeleyMono
          - name: PieMono
            plan: PieMono
          - name: CidMono
            plan: CidMono
          - name: Mayulite
            plan: Mayulite
          - name: Firastorm
            plan: firastorm
          - name: MayuCode
            plan: MayuCode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          ref: ${{ needs.detect-version.outputs.tag }}
          path: iosevka
          show-progress: false

      - name: Copy build plan
        run: cp private-build-plans-${{ matrix.font.plan }}.toml iosevka/private-build-plans.toml

      - run: sudo apt-get update && sudo apt-get install -y ttfautohint

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: iosevka

      - name: Build ${{ matrix.font.name }}
        working-directory: iosevka
        run: npm run build -- ttf::${{ matrix.font.plan }}

      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.font.name }}-v${{ needs.detect-version.outputs.version }}
        run: |
          HTTP=$(gh api repos/${{ github.repository }}/releases/tags/"$TAG" \
            --silent -i 2>&1 | head -1 | awk '{print $2}')
          if [ "$HTTP" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch with Nerd Fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          mkdir -p patched
          docker run --rm \
            -v ${{ github.workspace }}/iosevka/dist/${{ matrix.font.plan }}/TTF:/in \
            -v ${{ github.workspace }}/patched:/out \
            -e PN=4 \
            nerdfonts/patcher \
            --complete \
            --no-progressbars

      - name: Package fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          cd iosevka/dist/${{ matrix.font.plan }}/TTF
          zip -rq "$GITHUB_WORKSPACE/${{ matrix.font.name }}-TTF.zip" .
          tar cJf "$GITHUB_WORKSPACE/${{ matrix.font.name }}-TTF.tar.xz" .
          cd "$GITHUB_WORKSPACE"

          cd patched
          zip -rq "$GITHUB_WORKSPACE/${{ matrix.font.name }}-NerdFont.zip" .
          tar cJf "$GITHUB_WORKSPACE/${{ matrix.font.name }}-NerdFont.tar.xz" .

      - name: Upload artifacts
        if: steps.check-release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.font.name }}-${{ needs.detect-version.outputs.version }}
          path: |
            ${{ matrix.font.name }}-TTF.zip
            ${{ matrix.font.name }}-TTF.tar.xz
            ${{ matrix.font.name }}-NerdFont.zip
            ${{ matrix.font.name }}-NerdFont.tar.xz
          retention-days: 1

  # ──────────────────────────────────────────────
  # Download and patch upstream Iosevka
  # ──────────────────────────────────────────────
  patch-iosevka:
    needs: detect-version
    runs-on: ubuntu-latest
    steps:
      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: Iosevka-v${{ needs.detect-version.outputs.version }}
        run: |
          HTTP=$(gh api repos/${{ github.repository }}/releases/tags/"$TAG" \
            --silent -i 2>&1 | head -1 | awk '{print $2}')
          if [ "$HTTP" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Iosevka TTF
        if: steps.check-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.detect-version.outputs.tag }}" \
            --repo be5invis/Iosevka \
            --pattern "PkgTTF-Iosevka-${{ needs.detect-version.outputs.version }}.zip" \
            --output iosevka-ttf.zip

      - name: Extract and select styles
        if: steps.check-release.outputs.exists == 'false'
        run: |
          mkdir -p fonts selected patched
          unzip -q iosevka-ttf.zip -d fonts
          for style in Regular Italic Medium MediumItalic Bold BoldItalic; do
            src="fonts/Iosevka-${style}.ttf"
            if [[ -f "$src" ]]; then
              cp "$src" selected/
            fi
          done
          if [[ -z "$(ls -A selected 2>/dev/null)" ]]; then
            echo "::error::No fonts found to patch"
            exit 1
          fi

      - name: Patch with Nerd Fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/selected:/in \
            -v ${{ github.workspace }}/patched:/out \
            -e PN=4 \
            nerdfonts/patcher \
            --complete \
            --makegroups 6 \
            --no-progressbars

      - name: Package fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          cd selected
          zip -rq "$GITHUB_WORKSPACE/Iosevka-TTF.zip" .
          tar cJf "$GITHUB_WORKSPACE/Iosevka-TTF.tar.xz" .
          cd "$GITHUB_WORKSPACE"

          cd patched
          zip -rq "$GITHUB_WORKSPACE/Iosevka-NerdFont.zip" .
          tar cJf "$GITHUB_WORKSPACE/Iosevka-NerdFont.tar.xz" .

      - name: Upload artifacts
        if: steps.check-release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Iosevka-${{ needs.detect-version.outputs.version }}
          path: |
            Iosevka-TTF.zip
            Iosevka-TTF.tar.xz
            Iosevka-NerdFont.zip
            Iosevka-NerdFont.tar.xz
          retention-days: 1

  # ──────────────────────────────────────────────
  # Release per font
  # ──────────────────────────────────────────────
  release:
    needs: [detect-version, build, patch-iosevka]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        font:
          - name: Iosevka
            title: "Iosevka (patched with Nerd Fonts)"
          - name: IoskeleyMono
            title: "IoskeleyMono"
          - name: PieMono
            title: "PieMono"
          - name: CidMono
            title: "CidMono"
          - name: Mayulite
            title: "Mayulite"
          - name: Firastorm
            title: "Firastorm"
          - name: MayuCode
            title: "MayuCode"
    steps:
      - name: Download artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.font.name }}-${{ needs.detect-version.outputs.version }}
          path: dist

      - name: Create release and upload
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.font.name }}-v${{ needs.detect-version.outputs.version }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          NF_TAG: ${{ needs.detect-version.outputs.nf_tag }}
        run: |
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "${{ matrix.font.title }} (v${VERSION})" \
            --notes "Built from [Iosevka v${VERSION}](https://github.com/be5invis/Iosevka/releases/tag/v${VERSION})
          Patched with [Nerd Fonts ${NF_TAG}](https://github.com/ryanoasis/nerd-fonts/releases/tag/${NF_TAG})" \
            2>/dev/null || true
          for f in dist/*; do
            gh release upload "$TAG" \
              --repo ${{ github.repository }} \
              --clobber "$f"
          done
