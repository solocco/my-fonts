name: Build Fonts

on:
  workflow_dispatch:
    inputs:
      iosevka_tag:
        description: "Iosevka tag to build (leave empty for latest)"
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild and overwrite even if the release already exists"
        type: boolean
        required: false
        default: false
  # Editing a build plan (or the font list) on main triggers an automatic
  # rebuild. The Iosevka version is unchanged, so the run is force-rebuilt to
  # overwrite the existing release instead of skipping it.
  push:
    branches: [main]
    paths:
      - "private-build-plans-*.toml"
      - "fonts.json"
  schedule:
    - cron: "0 0 * * 1"

# Avoid overlapping runs racing on release creation; queue newer runs instead
# of cancelling long font builds midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Detect latest Iosevka version
  # ──────────────────────────────────────────────
  detect-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      nf_tag: ${{ steps.check.outputs.nf_tag }}
      force: ${{ steps.check.outputs.force }}
    permissions:
      contents: read
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.iosevka_tag }}" ]; then
            TAG="${{ inputs.iosevka_tag }}"
          else
            TAG=$(gh release list --repo be5invis/Iosevka --limit 50 \
              --json tagName,isPrerelease,isDraft \
              --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' \
              | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Failed to fetch latest Iosevka tag"
            exit 1
          fi
          VERSION="${TAG#v}"

          NF_TAG=$(gh api repos/ryanoasis/nerd-fonts/releases/latest --jq '.tag_name') || {
            echo "::error::Failed to fetch latest Nerd Fonts release"
            exit 1
          }
          if [ -z "$NF_TAG" ]; then
            echo "::error::Got empty Nerd Fonts tag"
            exit 1
          fi

          # Force a rebuild (overwrite existing releases) when explicitly
          # requested, or when a push edited a build plan / the font list.
          if [ "${{ inputs.force_rebuild }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            FORCE=true
          else
            FORCE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "nf_tag=$NF_TAG" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "✓ Iosevka: $TAG | Nerd Fonts: $NF_TAG | force=$FORCE"

          {
            echo "## Build configuration"
            echo ""
            echo "| Component | Version |"
            echo "| --- | --- |"
            echo "| Iosevka | \`$TAG\` |"
            echo "| Nerd Fonts | \`$NF_TAG\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Force rebuild | \`$FORCE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Load font matrix from fonts.json
  # ──────────────────────────────────────────────
  load-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fonts: ${{ steps.set.outputs.fonts }}
      build_fonts: ${{ steps.set.outputs.build_fonts }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate fonts.json
        run: |
          jq empty fonts.json || {
            echo "::error::fonts.json is not valid JSON"
            exit 1
          }
          # Every entry with a plan must have a matching build-plan file.
          missing=0
          while read -r plan; do
            [ -z "$plan" ] && continue
            if [ ! -f "private-build-plans-${plan}.toml" ]; then
              echo "::error::Missing build plan file: private-build-plans-${plan}.toml"
              missing=1
            fi
          done < <(jq -r '.[] | select(.plan != null) | .plan' fonts.json)
          [ "$missing" -eq 0 ] || exit 1

      - id: set
        run: |
          echo "fonts=$(jq -c . fonts.json)" >> "$GITHUB_OUTPUT"
          echo "build_fonts=$(jq -c '[.[] | select(.plan != null)]' fonts.json)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Build custom fonts from source
  # ──────────────────────────────────────────────
  build:
    needs: [detect-version, load-config]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        font: ${{ fromJson(needs.load-config.outputs.build_fonts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          ref: ${{ needs.detect-version.outputs.tag }}
          path: iosevka
          show-progress: false

      - name: Copy build plan
        run: cp private-build-plans-${{ matrix.font.plan }}.toml iosevka/private-build-plans.toml

      - run: sudo apt-get update && sudo apt-get install -y ttfautohint

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache Iosevka's node_modules per upstream tag so repeat builds skip the
      # slow dependency install. Keyed on the tag because deps are pinned per
      # Iosevka release.
      - name: Cache Iosevka node_modules
        uses: actions/cache@v4
        with:
          path: iosevka/node_modules
          key: iosevka-node-${{ runner.os }}-node22-${{ needs.detect-version.outputs.tag }}

      - run: npm install
        working-directory: iosevka

      - name: Build ${{ matrix.font.name }}
        working-directory: iosevka
        run: npm run build -- ttf::${{ matrix.font.plan }}

      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.font.name }}-v${{ needs.detect-version.outputs.version }}
          FORCE: ${{ needs.detect-version.outputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested — will overwrite $TAG"
            exit 0
          fi
          HTTP=$(gh api repos/${{ github.repository }}/releases/tags/"$TAG" \
            --silent -i 2>&1 | head -1 | awk '{print $2}')
          if [ "$HTTP" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch with Nerd Fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          mkdir -p patched
          docker run --rm \
            -v ${{ github.workspace }}/iosevka/dist/${{ matrix.font.plan }}/TTF:/in \
            -v ${{ github.workspace }}/patched:/out \
            -e PN=4 \
            nerdfonts/patcher \
            --complete \
            --no-progressbars

      - name: Package fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          cd iosevka/dist/${{ matrix.font.plan }}/TTF
          zip -rq "$GITHUB_WORKSPACE/${{ matrix.font.name }}-TTF.zip" .
          tar cJf "$GITHUB_WORKSPACE/${{ matrix.font.name }}-TTF.tar.xz" .
          cd "$GITHUB_WORKSPACE"

          cd patched
          zip -rq "$GITHUB_WORKSPACE/${{ matrix.font.name }}-NerdFont.zip" .
          tar cJf "$GITHUB_WORKSPACE/${{ matrix.font.name }}-NerdFont.tar.xz" .

      - name: Upload artifacts
        if: steps.check-release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.font.name }}-${{ needs.detect-version.outputs.version }}
          path: |
            ${{ matrix.font.name }}-TTF.zip
            ${{ matrix.font.name }}-TTF.tar.xz
            ${{ matrix.font.name }}-NerdFont.zip
            ${{ matrix.font.name }}-NerdFont.tar.xz
          retention-days: 1

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.check-release.outputs.exists }}" = "true" ]; then
            echo "- ⏭️ **${{ matrix.font.name }}** — release already exists, skipped" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ **${{ matrix.font.name }}** — built from Iosevka \`${{ needs.detect-version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ **${{ matrix.font.name }}** — build failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # Download and patch upstream Iosevka
  # ──────────────────────────────────────────────
  patch-iosevka:
    needs: detect-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: Iosevka-v${{ needs.detect-version.outputs.version }}
          FORCE: ${{ needs.detect-version.outputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested — will overwrite $TAG"
            exit 0
          fi
          HTTP=$(gh api repos/${{ github.repository }}/releases/tags/"$TAG" \
            --silent -i 2>&1 | head -1 | awk '{print $2}')
          if [ "$HTTP" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Iosevka TTF
        if: steps.check-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.detect-version.outputs.tag }}" \
            --repo be5invis/Iosevka \
            --pattern "PkgTTF-Iosevka-${{ needs.detect-version.outputs.version }}.zip" \
            --output iosevka-ttf.zip

      - name: Extract and select styles
        if: steps.check-release.outputs.exists == 'false'
        run: |
          mkdir -p fonts selected patched
          unzip -q iosevka-ttf.zip -d fonts
          for style in Regular Italic Medium MediumItalic Bold BoldItalic; do
            src="fonts/Iosevka-${style}.ttf"
            if [[ -f "$src" ]]; then
              cp "$src" selected/
            fi
          done
          if [[ -z "$(ls -A selected 2>/dev/null)" ]]; then
            echo "::error::No fonts found to patch"
            exit 1
          fi

      - name: Patch with Nerd Fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/selected:/in \
            -v ${{ github.workspace }}/patched:/out \
            -e PN=4 \
            nerdfonts/patcher \
            --complete \
            --makegroups 6 \
            --no-progressbars

      - name: Package fonts
        if: steps.check-release.outputs.exists == 'false'
        run: |
          cd selected
          zip -rq "$GITHUB_WORKSPACE/Iosevka-TTF.zip" .
          tar cJf "$GITHUB_WORKSPACE/Iosevka-TTF.tar.xz" .
          cd "$GITHUB_WORKSPACE"

          cd patched
          zip -rq "$GITHUB_WORKSPACE/Iosevka-NerdFont.zip" .
          tar cJf "$GITHUB_WORKSPACE/Iosevka-NerdFont.tar.xz" .

      - name: Upload artifacts
        if: steps.check-release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Iosevka-${{ needs.detect-version.outputs.version }}
          path: |
            Iosevka-TTF.zip
            Iosevka-TTF.tar.xz
            Iosevka-NerdFont.zip
            Iosevka-NerdFont.tar.xz
          retention-days: 1

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.check-release.outputs.exists }}" = "true" ]; then
            echo "- ⏭️ **Iosevka** (upstream) — release already exists, skipped" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ **Iosevka** (upstream) — patched with Nerd Fonts" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ **Iosevka** (upstream) — failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # Release per font
  # ──────────────────────────────────────────────
  release:
    needs: [detect-version, build, patch-iosevka, load-config]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        font: ${{ fromJson(needs.load-config.outputs.fonts) }}
    steps:
      - name: Download artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.font.name }}-${{ needs.detect-version.outputs.version }}
          path: dist

      - name: Generate checksums
        if: steps.download.outcome == 'success'
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release and upload
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.font.name }}-v${{ needs.detect-version.outputs.version }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          NF_TAG: ${{ needs.detect-version.outputs.nf_tag }}
        run: |
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "${{ matrix.font.title }} (v${VERSION})" \
            --notes "Built from [Iosevka v${VERSION}](https://github.com/be5invis/Iosevka/releases/tag/v${VERSION})
          Patched with [Nerd Fonts ${NF_TAG}](https://github.com/ryanoasis/nerd-fonts/releases/tag/${NF_TAG})

          \`SHA256SUMS.txt\` lists checksums for every asset." \
            2>/dev/null || true
          for f in dist/*; do
            gh release upload "$TAG" \
              --repo ${{ github.repository }} \
              --clobber "$f"
          done
          echo "- 📦 **${{ matrix.font.name }}** — released as [\`$TAG\`](https://github.com/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
