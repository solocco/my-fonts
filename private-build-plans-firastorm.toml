[buildPlans.firastorm]
family = "Firastorm"
spacing = "normal"
serifs = "sans"
no-cv-ss = false
no-ligation = false
webfont-formats = ['woff2']

###################################################################################################
# Configure variants

[buildPlans.firastorm.variants]
inherits = "ss05"

[buildPlans.firastorm.variants.design]
f = 'serifless'
r = 'corner-hooked-base-serifed'
zero = 'oval-reverse-slashed'
one = 'base-long-top-serif'
eight = 'two-circles'
asterisk = 'penta-low'
brace = 'curly-flat-boundary'
number-sign = 'upright-tall'
at = 'threefold-tall'
paren = 'large-contour'
percent = 'rings-segmented-slash'
underscore = 'high'
punctuation-dot = 'round'
digit-form = 'lining'

[buildPlans.firastorm.variants.italic]
a = 'single-storey-tailed'
f = 'tailed'
r = 'corner-hooked-base-serifed'

###################################################################################################
# Configure ligations

[buildPlans.firastorm.ligations]
inherits = "default-calt"
disables = []
enables  = [
    "center-ops",
    "arrow-l-hyphen",
    "arrow-r-hyphen",
    "arrow-lr-hyphen",
    "arrow-l-equal",
    "arrow-r-equal",
    "arrow-lr-equal",
    "trig",
    "eqeqeq",
    "eqeq",
    "lteq",
    "gteq",
    "exeqeq",
    "exeq",
    "brst",
    "plus-plus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

[buildPlans.firastorm.weights.Regular]
shape = 415
menu = 400
css = 400
[buildPlans.firastorm.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.firastorm.weights.Medium]
shape = 510
menu = 500
css = 500
[buildPlans.firastorm.widths.Normal]
shape = 604
menu = 5
css = "normal"
[buildPlans.firastorm.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"
[buildPlans.firastorm.slopes.Italic]
angle = 9.5
shape = "italic"
menu = "italic"
css = "italic"
# Metric overrides
[buildPlans.firastorm.metricOverride]
xHeight = 540
cap = 720
ascender = 735
sb = 'blend(weight, [400, 90], [700, 78])'
accentWidth = 200
accentClearance = 80
accentHeight = 170
accentStackOffset = 208
leading = 1170
parenSize = 950
periodSize = 150
essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 185
smallArchDepth = 190
