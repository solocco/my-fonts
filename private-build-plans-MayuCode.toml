[buildPlans.MayuCode]
family = "Mayucode"
spacing = "normal"
serifs = "sans"
webfontFormats = ['WOFF2']

###################################################################################################
# Configure variants

[buildPlans.MayuCode.variants]
inherits = "ss18"

[buildPlans.MayuCode.variants.design]
capital-a          = 'straight-serifless'
capital-b          = 'more-asymmetric-serifless'
capital-c          = 'serifless'
capital-d          = 'more-rounded-serifless'
capital-g          = 'toothless-corner-serifless-hooked'
capital-k          = 'symmetric-connected-serifless'
capital-u          = 'toothless-rounded-serifless'
f                  = 'flat-hook-serifless'
k                  = 'symmetric-connected-serifless'
l                  = 'serifed'
m                  = 'earless-rounded-double-arch-serifless'
n                  = 'straight-serifless'
r                  = 'serifless'
u                  = 'toothless-rounded-serifless'
y                  = 'straight-turn-serifless'
z                  = 'straight-serifless'
zero               = 'reverse-slashed'
one                = 'base-long-top-serif'
two                = 'curly-neck-serifless'
three              = 'two-arcs'
four               = 'semi-open-non-crossing-serifless'
five               = 'upright-arched-serifless'
six                = 'closed-contour'
seven              = 'bend-serifless'
eight              = 'two-circles'
nine               = 'closed-contour'
asterisk           = 'penta-low'
brace              = 'curly-flat-boundary'
cent               = 'through'
dollar             = 'through'
number-sign        = 'upright-tall'
paren              = 'large-contour'
percent            = 'rings-continuous-slash'
underscore         = 'high'
punctuation-dot    = 'round'
at                 = 'threefold-tall'
digit-form         = 'lining'

[buildPlans.MayuCode.variants.italic]
f                  = 'flat-hook-extended'

###################################################################################################
# Configure ligations

[buildPlans.MayuCode.ligations]
inherits = "default-calt"
disables = []
enables  = [
    "center-ops",
    "arrow-l",
    "arrow-r",
    "arrow-lr",
    "trig",
    "eqeqeq",
    "eqeq",
    "lteq",
    "gteq",
    "exeqeq",
    "exeq",
    "brst",
    "plus-plus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

###################################################################################################
[buildPlans.MayuCode.weights.Regular]
shape = 400
menu = 400
css = 400
[buildPlans.MayuCode.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.MayuCode.weights.Medium]
shape = 500
menu = 500
css = 500
[buildPlans.MayuCode.widths.Normal]
shape = 500
menu = 5
css = "normal"

###################################################################################################
[buildPlans.MayuCode.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.MayuCode.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"
