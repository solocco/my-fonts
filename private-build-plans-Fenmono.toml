[buildPlans.Fenmono]
family = "Fenmono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
[buildPlans.Fenmono.variants]
inherits = "ss04"
[buildPlans.Fenmono.variants.design]
	four = "semi-open-serifless"
    five = "upright-flat-hook-serifless"
    six = "open-contour"
    nine = "open-contour"
    zero = "tall-slashed"
    a = "double-storey-tailed"
    f = "flat-hook-serifless"
    g = "double-storey-open"
    r = "serifed"
    t = "flat-hook-short-neck"
    partial-derivative = "curly-bar"
    punctuation-dot = "round"
    asterisk = "penta-low"
    paren = "normal"
    at = "compact"
    percent = "rings-continuous-slash"
    lig-single-arrow-bar = "without-notch"
[buildPlans.Fenmono.weights.Regular]
shape = 400
menu = 400
css = 400
[buildPlans.Fenmono.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.Fenmono.weights.Medium]
shape = 500
menu = 500
css = 500
[buildPlans.Fenmono.widths.Normal]
shape = 525
menu = 5
css = "normal"
[buildPlans.Fenmono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"
[buildPlans.Fenmono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
