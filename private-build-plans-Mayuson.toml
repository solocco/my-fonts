[buildPlans.Mayuson]
family = "Mayuson"
spacing = "normal"
serifs = "sans"

[buildPlans.Mayuson.variants]
inherits = "ss03"

[buildPlans.Mayuson.variants.design]
a = 'double-storey-serifless'
m = 'earless-rounded-double-arch-serifless'
u = 'toothless-rounded-serifless'
zero = 'oval-reverse-slashed'
one = 'base-long-top-serif'
asterisk = 'penta-low'
brace = 'curly-flat-boundary'
number-sign = 'upright-tall'
paren = 'large-contour'
percent = 'rings-continuous-slash'
underscore = 'high'
punctuation-dot = 'round'
question = 'smooth'
at = 'threefold-tall'
digit-form = 'lining'

[buildPlans.Mayuson.variants.italic]
a = 'single-storey-tailed'

[buildPlans.Mayuson.ligations]
inherits = "default-calt"
disables = []
enables  = [
    "center-ops",
    "arrow-l",
    "arrow-r",
    "arrow-lr",
    "trig",
    "eqeqeq",
    "eqeq",
    "lteq",
    "gteq",
    "exeqeq",
    "exeq",
    "brst",
    "plus-plus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

[buildPlans.Mayuson.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Mayuson.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.Mayuson.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Mayuson.slopes.upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.Mayuson.slopes.italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"

[buildPlans.Mayuson.widths.Normal]
shape = 500
menu  = 5
css   = "normal"
